services:
  postgres:
    image: postgres:16
    container_name: learning-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: learning
      POSTGRES_PASSWORD: learning
      POSTGRES_DB: learning_db
    volumes:
      - learning_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning -d learning_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  learning_pgdata:
